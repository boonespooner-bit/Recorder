# Render Blueprint. If picture-perfect lives in its own repo, put this file at
# the repo root and use "New +" -> "Blueprint" in Render. If it stays inside a
# larger repo, create the web service manually and set Root Directory instead
# (see README).
services:
  - type: web
    name: picture-perfect
    runtime: node
    plan: starter
    rootDir: picture-perfect
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set the value in the Render dashboard, never in git
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: DATA_DIR
        value: /var/data
    disk:
      name: picture-perfect-data
      mountPath: /var/data
      sizeGB: 1
